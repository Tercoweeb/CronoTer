*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --r:#ce0000;--g:#139b20;--y:#d4840a;
  --b:#000;--b1:#111;--b2:#1a1a1a;--b3:#242424;
  --cr:#fff2d2;--cr7:rgba(255,242,210,.7);--cr4:rgba(255,242,210,.4);--cr15:rgba(255,242,210,.15);--cr07:rgba(255,242,210,.07);
  --ff:'NU','Arial Black',sans-serif;--fh:'HC','Georgia',serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:var(--ff);font-weight:900;background:var(--b);color:var(--cr)}
button{font-family:var(--ff);font-weight:900;cursor:pointer;border:none;outline:none;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--r);outline-offset:3px;border-radius:4px}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--cr15);border-radius:2px}

/* PIN LOCK — Fase 14 Seguridad */
#pin-screen{
  position:fixed;inset:0;background:var(--b);z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  padding:24px;
}
#pin-screen.hidden{display:none}
.pin-logo img{height:48px;width:auto}
.pin-title{font-size:clamp(.75rem,2vw,.9rem);text-transform:uppercase;letter-spacing:.2em;color:var(--cr4)}
.pin-error{font-size:.72rem;color:var(--r);letter-spacing:.1em;text-transform:uppercase;min-height:20px}
.pin-dots{display:flex;gap:12px;margin:8px 0}
.pin-dot{
  width:18px;height:18px;border-radius:50%;
  border:2px solid var(--cr15);background:transparent;transition:all .15s;
}
.pin-dot.filled{background:var(--r);border-color:var(--r)}
.pin-pad{display:grid;grid-template-columns:repeat(3,80px);gap:12px}
.pkey{
  height:72px;border-radius:12px;font-size:1.6rem;
  background:var(--b2);border:2px solid var(--cr15);color:var(--cr);
  transition:all .12s;display:flex;align-items:center;justify-content:center;
}
.pkey:active{background:var(--b3);transform:scale(.94)}
.pkey.del{font-size:1.1rem;color:var(--cr4)}
.pin-hint{font-size:.62rem;color:var(--cr4);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;font-weight:500}

/* TOP BAR */
.tb{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--b);border-bottom:3px solid var(--r);
  padding:0 16px;height:60px;position:sticky;top:0;z-index:90;flex-shrink:0;
}
.tb__logo img{height:38px;width:auto}
.tb__clock{
  font-size:clamp(.9rem,2.2vw,1.4rem);letter-spacing:.06em;
  font-variant-numeric:tabular-nums;color:var(--cr4);
}
.tb__acts{display:flex;gap:6px}
.ib{
  width:44px;height:44px;border-radius:9px;
  border:2px solid var(--cr07);background:var(--b2);
  display:flex;align-items:center;justify-content:center;
  color:var(--cr4);transition:all .15s;flex-shrink:0;
}
.ib svg{width:19px;height:19px;fill:currentColor}
.ib:hover{color:var(--cr);border-color:var(--cr4)}
.ib.on{color:var(--r);border-color:var(--r);background:rgba(206,0,0,.08)}

/* VOICE indicator */
.voice-active{animation:vpulse 1.2s infinite}
@keyframes vpulse{0%,100%{box-shadow:0 0 0 0 rgba(19,155,32,.5)}50%{box-shadow:0 0 0 8px rgba(19,155,32,0)}}

/* NEXT BANNER */
.nb{
  display:none;background:rgba(212,132,10,.12);
  border-bottom:2px solid rgba(212,132,10,.4);
  padding:9px 16px;align-items:center;gap:10px;
}
.nb.on{display:flex}
.nb svg{width:16px;height:16px;fill:#e8960f;flex-shrink:0}
.nb__t{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#e8960f}

/* COUNTERS — Fase 10 Pantalla Principal */
.ctrs{
  display:flex;align-items:stretch;
  background:#080808;border-bottom:1px solid var(--cr07);
}
.ctr{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px 8px;gap:5px;border-right:1px solid var(--cr07);
}
.ctr:last-child{border-right:none}
.ctr__n{
  font-size:clamp(2.4rem,5.5vw,4rem);line-height:1;
  color:var(--r);font-variant-numeric:tabular-nums;letter-spacing:.02em;
  transition:color .3s;
}
.ctr__n.bump{animation:bump .28s ease}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.2);color:#ff4040}100%{transform:scale(1)}}
.ctr__label{
  display:flex;align-items:center;gap:5px;
  font-size:clamp(.55rem,1.2vw,.7rem);letter-spacing:.14em;
  text-transform:uppercase;color:var(--cr4);
}
.ctr__label svg{width:13px;height:13px;fill:currentColor}

/* GRID */
.grid{
  padding:14px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:12px;align-content:start;
}
@media(max-width:480px){.grid{padding:8px;gap:8px;grid-template-columns:1fr}}

/* ADD CARD */
.add-card{
  min-height:160px;border:2px dashed var(--cr15);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:rgba(255,242,210,.2);font-size:.7rem;letter-spacing:.14em;
  text-transform:uppercase;transition:all .18s;width:100%;
}
.add-card svg{width:30px;height:30px;fill:currentColor}
.add-card:hover{border-color:var(--r);color:var(--r);background:rgba(206,0,0,.04)}

/* GROUP CARD */
.gc{
  background:var(--b1);border:2px solid rgba(255,242,210,.08);
  border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .25s,box-shadow .25s;
}
.gc.fresh{border-color:rgba(19,155,32,.5)}
.gc.warn{border-color:rgba(212,132,10,.55)}
.gc.urgent{border-color:rgba(206,0,0,.7)}
.gc.done{border-color:var(--r);animation:cpulse .7s ease-in-out infinite alternate}
.gc.paused{border-color:rgba(120,120,255,.4)}
@keyframes cpulse{
  from{box-shadow:0 0 0 2px rgba(206,0,0,.18),0 0 24px rgba(206,0,0,.08)}
  to{box-shadow:0 0 0 6px rgba(206,0,0,.42),0 0 60px rgba(206,0,0,.22)}
}
.gc__h{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px 10px;border-bottom:1px solid var(--cr07);gap:8px;
}
.gc__num{font-size:clamp(.85rem,2vw,1rem);letter-spacing:.16em;text-transform:uppercase;color:var(--cr7)}
.gc__entry{font-size:.62rem;font-weight:500;color:var(--cr4);letter-spacing:.06em}
.gc__status{
  font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 10px;border-radius:5px;background:var(--cr07);color:var(--cr4);flex-shrink:0;
}
.gc__status.fresh{background:rgba(19,155,32,.15);color:#3cd651}
.gc__status.warn{background:rgba(212,132,10,.15);color:#e8960f}
.gc__status.urgent{background:rgba(206,0,0,.2);color:var(--r)}
.gc__status.done{background:var(--r);color:var(--cr);animation:blink .55s infinite}
.gc__status.paused{background:rgba(120,120,255,.15);color:#9999ff}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* TIMER — Fase 9 Botones grandes */
.gc__timer{
  display:flex;align-items:center;justify-content:center;
  gap:16px;padding:14px 12px 6px;
}
.rw{position:relative;flex-shrink:0}
.rw svg{transform:rotate(-90deg)}
.rbg{fill:none;stroke:rgba(255,242,210,.05);stroke-width:7}
.rfg{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.rnum{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.5rem,4.5vw,2.3rem);letter-spacing:.04em;
  font-variant-numeric:tabular-nums;line-height:1;
}
.gc__adj{display:flex;flex-direction:column;gap:5px}
.adj{
  background:var(--b2);border:1.5px solid var(--cr15);color:var(--cr4);
  border-radius:7px;padding:7px 11px;font-size:.68rem;letter-spacing:.06em;
  text-transform:uppercase;transition:all .12s;white-space:nowrap;min-width:60px;text-align:center;
}
.adj:hover{background:var(--b3);color:var(--cr)}
.adj.m:hover{border-color:var(--r);color:var(--r)}
.adj.p:hover{border-color:var(--g);color:#3cd651}

/* PROGRESS */
.gc__prog{padding:0 14px 5px}
.prog{height:4px;background:rgba(255,242,210,.06);border-radius:2px;overflow:hidden}
.prog__f{height:100%;border-radius:2px;transition:width 1s linear,background .3s}

/* ITEMS */
.gc__items{padding:8px 14px 4px;flex:1}
.items-empty{font-size:.7rem;color:rgba(255,242,210,.18);text-transform:uppercase;letter-spacing:.12em;text-align:center;padding:8px 0;font-weight:500}
.ir{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid rgba(255,242,210,.04)}
.ir:last-child{border-bottom:none}
.ir__img{width:38px;height:38px;border-radius:7px;object-fit:cover;flex-shrink:0;border:1px solid var(--cr07)}
.ir__info{flex:1;min-width:0}
.ir__name{font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--cr);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir__type{font-size:.6rem;font-weight:500;color:var(--cr4);margin-top:2px}
.ir__type.ent{color:rgba(206,0,0,.7)}
.ir__qty{font-size:.82rem;padding:4px 10px;border-radius:6px;flex-shrink:0;background:var(--cr07);color:var(--cr);border:1px solid var(--cr15)}

/* FOOTER BUTTONS */
.gc__foot{display:flex;gap:6px;padding:10px 14px 14px;flex-wrap:wrap;border-top:1px solid var(--cr07)}
.fb{
  flex:1;min-width:60px;border-radius:8px;padding:9px 7px;
  font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;
  border:2px solid transparent;transition:all .15s;text-align:center;
}
.fb.red{background:var(--r);color:var(--cr);border-color:var(--r)}
.fb.red:hover{background:#a50000}
.fb.grn{background:var(--g);color:var(--cr);border-color:var(--g);animation:glow 1s infinite}
.fb.grn:hover{background:#0f8019;animation:none}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(19,155,32,.4)}50%{box-shadow:0 0 0 6px rgba(19,155,32,0)}}
.fb.ghost{background:var(--b2);color:var(--cr7);border-color:var(--cr15)}
.fb.ghost:hover{background:var(--b3);color:var(--cr);border-color:var(--cr4)}
.fb.danger{background:rgba(206,0,0,.1);color:var(--r);border-color:rgba(206,0,0,.2)}
.fb.pause{background:rgba(120,120,255,.1);color:#9999ff;border-color:rgba(120,120,255,.2)}
.fb.accept{width:100%;flex:unset;min-width:unset;background:var(--g);color:var(--cr);border-color:var(--g);font-size:.78rem;padding:14px;border-radius:10px;animation:glow 1s infinite}
.fb.accept:hover{background:#0f8019;animation:none}
@media(max-width:480px){.fb{font-size:.6rem;padding:10px 6px;min-width:54px}}

/* ALARM FLASH */
#af{display:none;position:fixed;inset:0;pointer-events:none;z-index:49}
#af.on{display:block;animation:fl .7s infinite alternate}
@keyframes fl{from{background:rgba(206,0,0,.04)}to{background:rgba(206,0,0,.13)}}

/* MODAL */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sh{
  background:#111;border:2px solid var(--cr15);border-bottom:none;border-radius:18px 18px 0 0;
  width:100%;max-width:700px;max-height:92dvh;display:flex;flex-direction:column;
  animation:sup .25s cubic-bezier(.22,.61,.36,1);
  padding-bottom:var(--safe-b);
}
@keyframes sup{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.sh__h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--cr07);flex-shrink:0}
.sh__title{font-size:1rem;text-transform:uppercase;letter-spacing:.12em}
.sh__x{background:var(--b2);color:var(--cr7);border-radius:8px;padding:6px 14px;font-size:.9rem;border:1px solid var(--cr15)}
.sh__x:hover{background:rgba(206,0,0,.2);color:var(--r);border-color:var(--r)}
.dur-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 20px 10px;border-bottom:1px solid var(--cr07);flex-shrink:0}
.dur-label{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cr4)}
.dur-disp{font-size:1.5rem;letter-spacing:.04em;font-variant-numeric:tabular-nums;background:var(--b2);border-radius:8px;padding:6px 16px;border:2px solid var(--cr15);min-width:88px;text-align:center}
.dbtn{background:var(--b2);border:1.5px solid var(--cr15);color:var(--cr4);border-radius:7px;padding:7px 10px;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;transition:all .12s}
.dbtn:hover{background:var(--b3);color:var(--cr)}
.dbtn.m:hover{border-color:var(--r);color:var(--r)}
.dbtn.p:hover{border-color:var(--g);color:#3cd651}
.typ-tog{display:flex;margin:10px 20px 6px;background:rgba(255,242,210,.05);border-radius:9px;padding:3px;flex-shrink:0}
.tbtn{flex:1;padding:9px 10px;border-radius:7px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cr4);background:transparent;transition:all .15s}
.tbtn.on{background:var(--r);color:var(--cr)}
.pz-grid{padding:8px 10px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px;overflow-y:auto;flex:1}
@media(max-width:480px){.pz-grid{grid-template-columns:repeat(2,1fr)}}
.pz-opt{background:var(--b2);border:2px solid var(--cr07);border-radius:11px;overflow:hidden;cursor:pointer;transition:all .15s;position:relative}
.pz-opt:hover{border-color:rgba(255,242,210,.22)}
.pz-opt.sel{border-color:var(--r);background:rgba(206,0,0,.1)}
.pz-opt__img{width:100%;aspect-ratio:1;object-fit:cover}
.pz-opt__body{padding:8px 9px}
.pz-opt__name{font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--cr);line-height:1.2}
.pz-opt__qty{display:flex;align-items:center;gap:7px;margin-top:6px;background:var(--cr07);border-radius:7px;padding:4px 6px}
.pqb{width:26px;height:26px;border-radius:5px;background:rgba(255,242,210,.08);color:var(--cr);font-size:1rem;display:flex;align-items:center;justify-content:center;transition:background .12s}
.pqb:hover{background:rgba(206,0,0,.3)}
.pqn{font-size:.9rem;color:var(--cr);min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.pz-chk{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--r);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.pz-chk svg{width:12px;height:12px;fill:var(--cr)}
.pz-opt.sel .pz-chk{opacity:1}
.pz-badges{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.pzb{font-size:.42rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:3px}
.pzb.best{background:rgba(206,0,0,.2);color:var(--r)}
.pzb.spicy{background:rgba(255,100,0,.2);color:#f60}
.pzb.veg{background:rgba(19,155,32,.2);color:var(--g)}
.pzb.new{background:rgba(100,150,255,.2);color:#88aaff}
.sh__ok{margin:10px 20px 18px;padding:14px;background:var(--r);color:var(--cr);border-radius:10px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;width:calc(100% - 40px);transition:background .15s;flex-shrink:0}
.sh__ok:hover{background:#a50000}
.sh__ok:disabled{opacity:.3;cursor:not-allowed}

/* PANELS */
.panel{position:fixed;top:0;bottom:0;width:min(380px,100vw);background:#111;z-index:300;display:flex;flex-direction:column}
.panel.right{right:0;border-left:2px solid var(--cr15);transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.61,.36,1);padding-top:env(safe-area-inset-top,0px)}
.panel.left{left:0;border-right:2px solid var(--cr15);transform:translateX(-100%);transition:transform .3s cubic-bezier(.22,.61,.36,1);padding-top:env(safe-area-inset-top,0px)}
.panel.open{transform:translateX(0)}
.panel__h{
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);
  padding-left:18px;padding-right:18px;padding-bottom:16px;
  border-bottom:1px solid var(--cr07);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;min-height:calc(env(safe-area-inset-top,0px) + 64px);
  background:var(--b1);position:sticky;top:0;z-index:2;
}
.panel__title{font-size:.9rem;letter-spacing:.12em;text-transform:uppercase}
.panel__x{background:rgba(206,0,0,.15);color:var(--r);border-radius:10px;padding:12px 22px;font-size:1.1rem;font-weight:900;border:2px solid rgba(206,0,0,.3);min-width:52px;min-height:52px;display:flex;align-items:center;justify-content:center;letter-spacing:.04em}
.panel__body{flex:1;overflow-y:auto;padding:16px 18px}
.pg{margin-bottom:22px}
.pg__label{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cr4);padding-bottom:7px;border-bottom:1px solid var(--cr07);margin-bottom:12px}
.sp-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px}
.sp-row label{font-size:.72rem;font-weight:500;color:var(--cr7)}
.tog{position:relative;width:42px;height:24px;flex-shrink:0;background:var(--b3);border-radius:12px;border:2px solid var(--cr15);cursor:pointer;transition:background .2s}
.tog.on{background:var(--r);border-color:var(--r)}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--cr);transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tog.on::after{transform:translateX(18px)}
.sp-inp{background:var(--b2);border:2px solid var(--cr15);color:var(--cr);border-radius:8px;padding:7px 12px;font-family:var(--ff);font-weight:900;font-size:.85rem;width:90px;text-align:center}
.sp-inp:focus{border-color:var(--r);outline:none}
.kbd{font-size:.62rem;color:var(--cr4);line-height:2.2;font-weight:500}
.hp-item{padding:12px 0;border-bottom:1px solid var(--cr07)}
.hp-time{font-size:.62rem;color:var(--cr4);letter-spacing:.08em;margin-bottom:3px}
.hp-items{font-size:.7rem;color:var(--cr7);font-weight:500;margin-bottom:2px}
.hp-dur{font-size:.62rem;color:var(--g);letter-spacing:.08em}
.hp-empty{font-size:.7rem;color:var(--cr4);text-transform:uppercase;letter-spacing:.12em;font-weight:500}

/* NOTIFICATION BANNER */
.notif-bar{
  display:none;background:rgba(19,155,32,.1);border-bottom:1px solid rgba(19,155,32,.25);
  padding:8px 16px;align-items:center;gap:10px;font-size:.68rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--g);
}
.notif-bar.on{display:flex}
.notif-bar svg{width:14px;height:14px;fill:var(--g);flex-shrink:0}

/* VOICE STATUS */
.voice-status{
  display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(19,155,32,.9);color:var(--cr);border-radius:24px;
  padding:8px 20px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  z-index:500;white-space:nowrap;backdrop-filter:blur(8px);
}
.voice-status.on{display:block;animation:vfade 3s ease forwards}
@keyframes vfade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* TOASTS */
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(20,20,20,.96);border:1.5px solid var(--cr15);border-radius:9px;padding:9px 20px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cr7);backdrop-filter:blur(8px);animation:tin .22s ease;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* OFFLINE INDICATOR */
.offline-bar{display:none;background:rgba(206,0,0,.15);border-bottom:2px solid rgba(206,0,0,.4);padding:7px 16px;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--r);text-align:center}
.offline-bar.on{display:block}


/* ── SAFE AREAS (iPhone notch/Dynamic Island) ───────────────────── */
body { padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right); }
.tb { padding-top:max(0px,calc(env(safe-area-inset-top) - 10px));min-height:60px; }
.panel.right { padding-bottom:env(safe-area-inset-bottom); }
.panel.left { padding-bottom:env(safe-area-inset-bottom); }
.sh { padding-bottom:env(safe-area-inset-bottom); }

/* ── INSTALL SCREEN ─────────────────────────────────────────────── */
#install-screen {
  position:fixed;inset:0;background:var(--b);z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;padding:32px 24px;text-align:center;
}
#install-screen.hidden { display:none }
.is-logo img { height:52px;width:auto;margin-bottom:20px }
.is-title { font-size:clamp(1rem,4vw,1.4rem);letter-spacing:.06em;text-transform:uppercase;color:var(--cr);margin-bottom:6px }
.is-sub { font-size:.72rem;color:var(--cr4);letter-spacing:.1em;text-transform:uppercase;margin-bottom:28px;font-weight:500 }
.is-steps { width:100%;max-width:380px;margin-bottom:28px }
.is-step { display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--b2);border-radius:10px;margin-bottom:8px;text-align:left;border:1.5px solid var(--cr07) }
.is-step-num { font-size:1.1rem;color:var(--r);flex-shrink:0;width:24px;text-align:center }
.is-step-text { font-size:.72rem;color:var(--cr7);line-height:1.5;font-weight:500 }
.is-step-text strong { color:var(--cr);display:block;margin-bottom:2px;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase }
.is-arrow { font-size:1.5rem;animation:bounce .8s infinite alternate }
@keyframes bounce { from{transform:translateY(0)} to{transform:translateY(6px)} }
.is-btn { 
  background:var(--r);color:var(--cr);border-radius:12px;padding:16px 32px;
  font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;width:100%;max-width:340px;
  border:none;cursor:pointer;transition:background .15s;margin-bottom:8px;
}
.is-btn:hover { background:#a50000 }
.is-btn-ghost {
  background:transparent;color:var(--cr4);border:1.5px solid var(--cr15);border-radius:12px;
  padding:12px 24px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
  width:100%;max-width:340px;cursor:pointer;
}
.is-platform-android { display:none }
.is-platform-ios { display:none }
.is-share-icon { display:inline-block;background:var(--cr);color:var(--b);border-radius:5px;padding:2px 5px;font-size:.8rem;margin:0 2px }
.already-pwa { display:none }

/* ── INSTALL BANNER (when already inside app) ───────────────────── */
.install-banner {
  display:none;background:rgba(19,155,32,.1);border-bottom:1.5px solid rgba(19,155,32,.25);
  padding:10px 16px;align-items:center;gap:10px;flex-shrink:0;
}
.install-banner.on { display:flex }
.install-banner__text { flex:1;font-size:.68rem;color:rgba(19,155,32,.9);letter-spacing:.08em;text-transform:uppercase;font-weight:500 }
.install-banner__btn {
  background:var(--g);color:var(--cr);border-radius:7px;padding:6px 14px;
  font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0;
}

/* ── PERMISSION REQUEST BANNER ──────────────────────────────────── */
.perm-banner {
  display:none;background:rgba(212,132,10,.1);border-bottom:1.5px solid rgba(212,132,10,.3);
  padding:10px 16px;align-items:center;gap:10px;flex-shrink:0;
}
.perm-banner.on { display:flex }
.perm-banner__text { flex:1;font-size:.65rem;color:#e8960f;letter-spacing:.08em;text-transform:uppercase;font-weight:500 }
.perm-banner__btn { background:#d4840a;color:var(--cr);border-radius:7px;padding:6px 14px;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0 }
.perm-banner__x { color:var(--cr4);font-size:.9rem;padding:4px 8px;background:transparent;border:none;cursor:pointer;font-family:var(--ff) }

/* ── PLATFORM LIMIT WARNING inside card (iOS) ─────────────────────── */
.ios-warn {
  display:none;
  background:rgba(212,132,10,.08);border:1px solid rgba(212,132,10,.2);
  border-radius:8px;padding:8px 12px;margin:0 14px 8px;
  font-size:.62rem;color:#e8960f;letter-spacing:.06em;font-weight:500;line-height:1.5;
}
.ios { .ios-warn { display:block } }

/* ── VOICE indicator ────────────────────────────────────────────── */
.voice-active { animation:vpulse 1.2s infinite }
@keyframes vpulse { 0%,100%{box-shadow:0 0 0 0 rgba(19,155,32,.5)}50%{box-shadow:0 0 0 8px rgba(19,155,32,0)} }
/* ── LIVE TICKER — quick status bar ───────────────────────────── */
.ticker{
  display:none;background:#0a0a0a;border-bottom:1px solid var(--cr07);
  padding:0;overflow:hidden;
}
.ticker.on{display:block}
.ticker__inner{
  display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.ticker__inner::-webkit-scrollbar{display:none}
.ticker__chip{
  display:flex;align-items:center;gap:8px;
  padding:7px 14px;border-right:1px solid var(--cr07);
  flex-shrink:0;cursor:pointer;transition:background .15s;min-width:0;
}
.ticker__chip:hover{background:var(--b2)}
.ticker__num{
  font-size:.68rem;letter-spacing:.08em;color:var(--cr3);text-transform:uppercase;font-weight:500;
}
.ticker__time{
  font-size:.95rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.04em;
  min-width:44px;text-align:center;
}
.ticker__name{
  font-size:.58rem;color:var(--cr3);font-weight:500;letter-spacing:.04em;
  max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

</style>
</head>

/* ── SERVICE WORKER ───────────────────────────────────────────────── */
let swReg=null;
async function registerSW() {
  if(!('serviceWorker' in navigator)) return;
  try {
    swReg = await navigator.serviceWorker.register('./sw.js',{scope:'./'});
    // Listen for messages from SW
        navigator.serviceWorker.addEventListener('message', e => {
      const { type, groupId, delta } = e.data || {};

      if (type === 'TIMER_DONE' || type === 'ALARM_TAPPED') {
        // Timer finished while we were backgrounded — mark done and alarm
        const g = groups.find(x => x.id === groupId);
        if (g && g.status === 'running') {
          g.status = 'done'; g.remaining = 0;
          saveGroups();
        }
        if (groups.some(x => x.status === 'done')) startAlarm();
        render();
      }

      if (type === 'ADJUST_TIME') {
        const g = groups.find(x => x.id === groupId);
        if (g && delta) {
          adjT(g.id, delta);
        }
      }

      if (type === 'CANCEL_GROUP') {
        delGroup(groupId);
      }

      if (type === 'ACCEPT_GROUP') {
        acceptGroup(groupId);
      }

      if (type === 'SYNC_CHECK') onAppResume();
    });
    // Periodic Background Sync (Android Chrome)
    if('periodicSync' in swReg) {
      try {
        await swReg.periodicSync.register('check-timers',{minInterval:60*1000});
      } catch(e) {}
    }
  } catch(e) { console.warn('SW error:',e); }
}

function swMsg(data) {
  if(navigator.serviceWorker?.controller) {
    navigator.serviceWorker.controller.postMessage(data);
  }
}

/* ── NOTIFICATIONS ────────────────────────────────────────────────── */
async function requestNotifPerm() {
  document.getElementById('perm-banner').classList.remove('on');
  if(!('Notification' in window)) { toast('Notificaciones no disponibles en este navegador'); return; }
  const perm=await Notification.requestPermission();
  if(perm==='granted') { toast('Notificaciones activadas ✓ La alarma llegará aunque el móvil esté bloqueado'); }
  else { toast('Notificaciones denegadas — la alarma solo sonará con la app abierta'); }
}

function scheduleNotif(groupId, groupNum, endTime, itemNames) {
  // SW handles countdown display and final alarm notification
  swMsg({ type: 'SCHEDULE', groupId, groupNum, endTime, itemNames });
}
function cancelNotif(groupId) {
  swMsg({ type: 'CANCEL', groupId });
}

/* ── AUDIO ────────────────────────────────────────────────────────── */
let ACtx=null;
function ac() { if(!ACtx) ACtx=new(window.AudioContext||window.webkitAudioContext)(); return ACtx; }
function tone(f,d,v=.2,type='square',del=0) {
  if(!S.soundEnabled) return;
  try {
    const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type=type;
    const T=ctx.currentTime+del;
    g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(v*S.volume,T+.02);g.gain.linearRampToValueAtTime(0,T+d-.02);
    o.start(T);o.stop(T+d);
  } catch(e) {}
}
let alarmInt=null, alarmAutoStop=null, alarmSoundActive=false;


function startAlarm() {
  // Prevent double-start
  if (alarmRunning) { return; }
  alarmRunning = true;
  if (alarmInt) clearInterval(alarmInt);
  if (alarmAutoStop) clearTimeout(alarmAutoStop);

  const beep = () => [0, .18, .36, .54].forEach((d, i) => tone(i % 2 ? 660 : 880, .14, .22, 'square', d));
  beep();
  alarmInt = setInterval(beep, 1200);
  document.getElementById('af').classList.add('on');
  if (S.vibration && navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 600]);

  // Auto-mute after 15 seconds if voice didn't stop it
  alarmAutoStop = setTimeout(() => {
    clearInterval(alarmInt); alarmInt = null;
    // Keep visual alarm + button, just stop the noise
    if (groups.some(g => g.status === 'done')) {
      toast('Alarma silenciada — pulsa "Sacar del horno"');
    }
  }, 15000);

  // Start voice recognition to listen for "stop"
  if (voiceSupported && S.soundEnabled) startVoice();
}
function stopAlarmSound() {
  clearInterval(alarmInt); alarmInt=null;
  clearTimeout(alarmAutoStop); alarmAutoStop=null;
  alarmSoundActive = false;
  stopVoice();
  // Keep flash visible while groups are done
}

function stopAlarm() {
  stopAlarmSound();
  document.getElementById('af').classList.remove('on');
}

// Ensure alarm restarts when user returns to app and groups are done
function ensureAlarm() {
  if (groups.some(g => g.status === 'done') && !alarmSoundActive) {
    startAlarm();
  }
  if (!groups.some(g => g.status === 'done')) {
    stopAlarm();
  }
}
function chkAlarm() { ensureAlarm(); }

/* ── VOICE CONTROL (Android Chrome) ──────────────────────────────── */
let recognition=null,voiceActive=false;
const voiceSupported=('SpeechRecognition' in window||'webkitSpeechRecognition' in window)&&!isIOS;
const STOP_CMDS=['alto','para','párate','parate','stop','parar','para la alarma','apaga','apaga la alarma','silencio'];
if(voiceSupported) document.getElementById('voice-btn').style.display='flex';

function startVoice() {
  if(!voiceSupported||voiceActive) return;
  try {
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    recognition=new SR();recognition.continuous=true;recognition.interimResults=false;recognition.lang='es-ES';
    recognition.onresult=e=>{
      const t=e.results[e.results.length-1][0].transcript.toLowerCase().trim();
      if(STOP_CMDS.some(c=>t.includes(c))) { stopAllAlarms(); showVSt('Alarma detenida por voz'); }
    };
    recognition.onerror=()=>{voiceActive=false;document.getElementById('voice-btn').classList.remove('on','voice-active');};
    recognition.onend=()=>{ voiceActive=false; if(groups.some(g=>g.status==='done')) startVoice(); };
    recognition.start(); voiceActive=true;
    document.getElementById('voice-btn').classList.add('on','voice-active');
  } catch(e) { voiceActive=false; }
}
function stopVoice() {
  if(recognition){try{recognition.stop()}catch(e){}recognition=null;}
  voiceActive=false;
  document.getElementById('voice-btn').classList.remove('on','voice-active');
}
function toggleVoice() {

}

}
function stopAllAlarms() {
  groups.forEach(g=>{if(g.status==='done'){cancelNotif(g.id);g.status='accepted';g.items=[];}}); 
  stopAlarm(); saveGroups(); render(); toast('Alarmas detenidas');

/* ── STATE ────────────────────────────────────────────────────────── */
let groups=[],history=[],gCnt=0,tickId=null,warned=new Set();
let _pSl=-1,_pPz=-1;
const DEFS={defaultDuration:120,volume:.7,soundEnabled:true,vibration:true,confirmDelete:false,showSecs:true,sort:true,warnPct:40,urgentPct:15};
let S=Object.assign({},DEFS,JSON.parse(localStorage.getItem('ct_s')||'{}'));
function saveS() { localStorage.setItem('ct_s',JSON.stringify(S)); }

/* ── TIMESTAMP TIMERS ─────────────────────────────────────────────── */
function ensureTick() { if(!tickId) tickId=setInterval(tick,1000); }
function tick() {
  const now=Date.now(); let changed=false,newDone=false;
  groups.forEach(g=>{
    if(g.status!=='running') return;
    g.remaining=g.endTime?Math.max(0,Math.ceil((g.endTime-now)/1000)):Math.max(0,g.remaining-1);
    changed=true;
    if(g.remaining===30&&!warned.has(g.id)) { warned.add(g.id);tone(660,.12,.15,'sine');tone(880,.12,.15,'sine',.18);toast('30 segundos — Grupo #'+g.num); }
    if(g.remaining===0) { g.status='done'; newDone=true; }
  });
  if(newDone) startAlarm();
  if(changed) { render(); saveGroups(); }
  updClk();
}

function onAppResume() {
  const now = Date.now();
  let newDone = false;

  // Re-read from localStorage in case page was fully killed and reloaded
  // (iOS PWA kills the page when switching apps for too long)
  const saved = loadGroups();
  if (saved.length > 0 && groups.length === 0) {
    // Page was killed and reloaded — restore state
    groups = saved;
    gCnt = parseInt(localStorage.getItem('ct_n') || '0');
  }

  groups.forEach(g => {
    if (g.status === 'running' && g.endTime) {
      g.remaining = Math.max(0, Math.ceil((g.endTime - now) / 1000));
      if (g.remaining === 0) { g.status = 'done'; newDone = true; }
    }
  });
  if (newDone) {
    alarmSoundActive = false; // force restart even if was playing
    startAlarm();
  } else {
    ensureAlarm(); // restart if was stopped by auto-stop
  }
  render();
  saveGroups();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) onAppResume(); });
window.addEventListener('focus', onAppResume);
// iOS PWA: fires on return from another app
window.addEventListener('pageshow', e => { if (e.persisted) onAppResume(); });
// Handle URL hash from notification tap when app was closed
function handleHash() {
  const hash = location.hash;
  if (hash.startsWith('#alarm=')) {
    const groupId = parseInt(hash.split('=')[1]);
    onAppResume();
    // Mark that specific group as done if endTime has passed
    const g = groups.find(x => x.id === groupId);
    if (g && g.status === 'running' && g.endTime && g.endTime <= Date.now()) {
      g.status = 'done'; g.remaining = 0; saveGroups();
    }
    if (groups.some(x => x.status === 'done')) setTimeout(() => startAlarm(), 300);
    render();
    history.replaceState(null, '', location.pathname);
  }
  if (hash.startsWith('#accept=')) {
    const groupId = parseInt(hash.split('=')[1]);
    setTimeout(() => { acceptGroup(groupId); }, 400);
    history.replaceState(null, '', location.pathname);
  }
}
window.addEventListener('hashchange', handleHash);
window.addEventListener('online',()=>document.getElementById('offline-bar').classList.remove('on'));
window.addEventListener('offline',()=>document.getElementById('offline-bar').classList.add('on'));
function updClk() {
  const n=new Date();
  document.getElementById('clk').textContent=
    n.getHours().toString().padStart(2,'0')+':'+
    n.getMinutes().toString().padStart(2,'0')+
    (S.showSecs?':'+n.getSeconds().toString().padStart(2,'0'):'');
}

/* ── PERSISTENCE ──────────────────────────────────────────────────── */
function saveGroups() {
  // Always ensure endTime is a plain number (ms timestamp) for reliable restore
  const data = groups.map(g => ({
    ...g,
    startTime: g.startTime ? new Date(g.startTime).getTime() : null,
    endTime: g.endTime ? Number(g.endTime) : null,
  }));
  localStorage.setItem('ct_g', JSON.stringify(data));
  localStorage.setItem('ct_n', gCnt);
  // Also save a quick lookup for SW to check on resume
  const active = groups.filter(x=>x.status==='running').map(x=>({id:x.id,num:x.num,endTime:x.endTime}));
  localStorage.setItem('ct_active', JSON.stringify(active));
}
function loadGroups() {
  try {
    const now=Date.now();
    return JSON.parse(localStorage.getItem('ct_g')||'[]').map(g=>{
      if(g.status==='running'&&g.endTime) {
        g.remaining=Math.max(0,Math.ceil((g.endTime-now)/1000));
        if(g.remaining===0) g.status='done';
      }
      if(g.startTime) g.startTime=new Date(g.startTime);
      return g;
    });
  } catch(e) { return []; }
}
function saveHistory() { localStorage.setItem('ct_h',JSON.stringify(history.slice(0,30))); }
function loadHistory() {
  try { return JSON.parse(localStorage.getItem('ct_h')||'[]').map(h=>({...h,startTime:new Date(h.startTime),finishedAt:new Date(h.finishedAt)})); } catch(e) { return []; }
}

/* ── GROUPS CRUD ──────────────────────────────────────────────────── */
function addGroup(items,dur) {
  gCnt++;
  const endTime=Date.now()+dur*1000;
  const g={id:gCnt,num:gCnt,status:'running',endTime,totalTime:dur,remaining:dur,items:items.map(i=>({...i})),startTime:new Date()};
  groups.push(g);
  scheduleNotif(gCnt,gCnt,endTime,items.map(i=>{const p=PIZZAS.find(x=>x.id===i.pizzaId);return(i.qty+'× '+(p?p.name:i.pizzaId));}));
  ensureTick(); saveGroups(); render();
}
function delGroup(id) {
  const g=groups.find(x=>x.id===id); if(!g) return;
  if(S.confirmDelete&&g.status!=='done'&&!confirm('¿Eliminar?')) return;
  cancelNotif(id); groups=groups.filter(x=>x.id!==id); warned.delete(id); chkAlarm(); saveGroups(); render(); toast('Grupo eliminado');
}
function acceptGroup(id) {
  const g=groups.find(x=>x.id===id); if(!g) return;
  cancelNotif(id);
  swMsg({type:'ACCEPT', groupId:id}); // tell SW to close done notification
  history.unshift({num:g.num,items:g.items,startTime:g.startTime,duration:g.totalTime,finishedAt:new Date()});
  if(history.length>30) history.pop();
  groups=groups.filter(x=>x.id!==id); warned.delete(id); chkAlarm(); saveGroups(); saveHistory(); renderHp(); render();
  toast('Grupo #'+g.num+' sacado del horno');
}
function pauseGroup(id) {
  const g=groups.find(x=>x.id===id); if(!g) return;
  if(g.status==='running') {
    g.status='paused'; g.endTime=null; cancelNotif(id);
    toast('Pausa — Grupo #'+g.num);
  } else if(g.status==='paused') {
    g.status='running'; g.endTime=Date.now()+g.remaining*1000;
    scheduleNotif(id,g.num,g.endTime,g.items.map(i=>{const p=PIZZAS.find(x=>x.id===i.pizzaId);return i.qty+'× '+(p?p.name:i.pizzaId);}));
    toast('Reanudado — Grupo #'+g.num);
  }
  saveGroups(); render();
}
function resetGroup(id) {
  const g=groups.find(x=>x.id===id); if(!g) return;
  g.remaining=g.totalTime; g.endTime=Date.now()+g.totalTime*1000;
  if(g.status==='done') { g.status='running'; chkAlarm(); }
  scheduleNotif(id,g.num,g.endTime,g.items.map(i=>{const p=PIZZAS.find(x=>x.id===i.pizzaId);return i.qty+'× '+(p?p.name:i.pizzaId);}));
  warned.delete(id); saveGroups(); render(); toast('Reiniciado');
}
function adjT(id,d) {
  const g=groups.find(x=>x.id===id); if(!g) return;
  g.remaining=Math.max(5,Math.min(600,g.remaining+d));
  if(g.status==='running') {
    g.endTime=Date.now()+g.remaining*1000;
    scheduleNotif(id,g.num,g.endTime,g.items.map(i=>{const p=PIZZAS.find(x=>x.id===i.pizzaId);return i.qty+'× '+(p?p.name:i.pizzaId);}));
  }
  g.totalTime=Math.max(g.totalTime,g.remaining); saveGroups(); render();
}
function dupGroup(id) { const g=groups.find(x=>x.id===id);if(!g)return; addGroup(g.items,g.totalTime); toast('Duplicado'); }

/* ── RENDER ───────────────────────────────────────────────────────── */
function stOf(g) {
  if(g.status==='done') return 'done';if(g.status==='paused') return 'paused';if(g.status!=='running') return 'idle';
  const p=g.remaining/g.totalTime*100;if(p<=S.urgentPct) return 'urgent';if(p<=S.warnPct) return 'warn';return 'fresh';
}
const stL={idle:'En espera',fresh:'En horno',warn:'Pronto',urgent:'¡Urgente!',done:'¡LISTO!',paused:'Pausado'};
const stC={fresh:'#139b20',warn:'#d4840a',urgent:'#ce0000',done:'#ce0000',paused:'#9999ff',idle:'rgba(255,242,210,.08)'};
const tC={done:'var(--r)',warn:'#d4840a',urgent:'var(--r)',fresh:'var(--cr)',paused:'#9999ff',idle:'rgba(255,242,210,.2)'};

function buildCard(g) {
  const st=stOf(g),pct=Math.min(1,g.remaining/g.totalTime),r=46,circ=2*Math.PI*r,dashOff=circ*(1-pct);
  const col=stC[st],tc=tC[st];
  const ent=g.startTime?(new Date(g.startTime)).getHours().toString().padStart(2,'0')+':'+(new Date(g.startTime)).getMinutes().toString().padStart(2,'0'):'';
  const itemsHtml=g.items.length?g.items.map(i=>{
    const p=PIZZAS.find(x=>x.id===i.pizzaId);if(!p)return'';
    return`<div class="ir">
      <img class="ir__img" src="${PHOTOS[p.photo]||''}" alt="${p.name}" loading="lazy">
      <div class="ir__info"><div class="ir__name">${p.name}</div><div class="ir__type${i.type==='pizza'?' ent':''}">${i.type==='slice'?'Slice':'Entera 18"'}</div></div>
      <span class="ir__qty" aria-label="Cantidad: ${i.qty}">×${i.qty}</span>
    </div>`;
  }).join(''):'<div class="items-empty">Sin items — añade una pizza</div>';
  const iosNote = isIOS&&st==='running'?'<div class="ios-warn">iPhone: mantén la app abierta para que la alarma suene al bloquearse el móvil.</div>':'';
  let foot='';
  if(st==='done') {
    foot=`<button class="fb accept" onclick="acceptGroup(${g.id})" aria-label="Sacar grupo del horno">Sacar del horno</button>`;
  } else {
    foot=`
      <button class="fb ghost" onclick="adjT(${g.id},-15)" aria-label="Quitar 15 segundos">−15s</button>
      <button class="fb ghost" onclick="adjT(${g.id},30)" aria-label="Añadir 30 segundos">+30s</button>
      <button class="fb ${g.status==='paused'?'pause':g.status==='running'?'red':'ghost'}" onclick="pauseGroup(${g.id})">
        ${g.status==='running'?'Pausa':g.status==='paused'?'Reanudar':'Iniciar'}
      </button>
      <button class="fb ghost" onclick="resetGroup(${g.id})" aria-label="Reiniciar">Reset</button>
      <button class="fb ghost" onclick="dupGroup(${g.id})" aria-label="Duplicar">Dup.</button>
      <button class="fb danger" onclick="delGroup(${g.id})" aria-label="Borrar">Borrar</button>
    `;
  }
  const el=document.createElement('div');
  el.className=`gc ${st}`;el.id='g'+g.id;
  el.setAttribute('aria-label',`Grupo ${g.num}, ${stL[st]}, tiempo restante ${fmt(g.remaining)}`);
  el.innerHTML=`
    <div class="gc__h">
      <span class="gc__num">Grupo #${g.num}</span>
      <span class="gc__entry">Entró ${ent}</span>
      <span class="gc__status ${st}" aria-live="polite">${stL[st]}</span>
    </div>
    <div class="gc__timer">
      <div class="rw" role="timer" aria-label="Tiempo restante ${fmt(g.remaining)}">
        <svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true">
          <circle class="rbg" cx="52" cy="52" r="46"/>
          <circle class="rfg" cx="52" cy="52" r="46" stroke="${col}" stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${dashOff.toFixed(2)}"/>
        </svg>
        <div class="rnum" style="color:${tc}">${fmt(g.remaining)}</div>
      </div>
      <div class="gc__adj">
        <button class="adj m" onclick="adjT(${g.id},-30)" aria-label="Quitar 30 segundos">−30s</button>
        <button class="adj m" onclick="adjT(${g.id},-15)" aria-label="Quitar 15 segundos">−15s</button>
        <button class="adj p" onclick="adjT(${g.id},15)" aria-label="Añadir 15 segundos">+15s</button>
        <button class="adj p" onclick="adjT(${g.id},30)" aria-label="Añadir 30 segundos">+30s</button>
        <button class="adj p" onclick="adjT(${g.id},60)" aria-label="Añadir 1 minuto">+1 min</button>
      </div>
    </div>
    <div class="gc__prog"><div class="prog"><div class="prog__f" style="width:${(pct*100).toFixed(1)}%;background:${col}"></div></div></div>
    ${iosNote}
    <div class="gc__items">${itemsHtml}</div>
    <div class="gc__foot">${foot}</div>
  `;
  return el;
}

function render() {
  let sl=0,pz=0;
  groups.filter(g=>['running','done','paused'].includes(g.status)).forEach(g=>g.items.forEach(i=>{if(i.type==='slice')sl+=i.qty;else pz+=i.qty;}));
  ['sl','pz'].forEach((k,idx)=>{
    const el=document.getElementById('c-'+k),nv=idx===0?sl:pz,pv=idx===0?_pSl:_pPz;
    if(el){el.textContent=nv;if(nv!==pv){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}}
    if(idx===0)_pSl=sl;else _pPz=pz;
  });
  const cgr=document.getElementById('c-gr');
  if(cgr) cgr.textContent=groups.filter(g=>['running','paused','done'].includes(g.status)).length;
  const nb=document.getElementById('nb'),run=groups.filter(g=>g.status==='running').sort((a,b)=>a.remaining-b.remaining);
  if(run.length){document.getElementById('nb-t').textContent='Grupo #'+run[0].num+' en '+fmt(run[0].remaining);nb.classList.add('on');}
  else nb.classList.remove('on');
  const grid=document.getElementById('grid');
  let add=document.getElementById('add-btn');
  Array.from(grid.children).forEach(el=>{if(el.id!=='add-btn')el.remove();});
  if(!add){
    add=document.createElement('button');add.id='add-btn';add.className='add-card';add.onclick=openModal;
    add.setAttribute('aria-label','Nuevo grupo');
    add.innerHTML=`<svg viewBox="0 0 24 24" style="fill:currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Nuevo Grupo`;
    grid.appendChild(add);
  }
  let sorted=[...groups];
  if(S.sort) sorted.sort((a,b)=>{if(a.status==='done'&&b.status!=='done')return-1;if(b.status==='done'&&a.status!=='done')return 1;return a.remaining-b.remaining;});
  sorted.forEach(g=>grid.insertBefore(buildCard(g),add));
  renderTicker();
}

function renderTicker() {
  const active = groups.filter(g => ['running','paused','done'].includes(g.status));
  const ticker = document.getElementById('ticker');
  const inner = document.getElementById('ticker-inner');
  if (!ticker || !inner) return;
  if (active.length === 0) { ticker.classList.remove('on'); return; }
  ticker.classList.add('on');
  inner.innerHTML = active.map(g => {
    const st = stOf(g);
    const col = stC[st] || 'var(--cr)';
    const items = g.items.slice(0,2).map(i=>{const p=PIZZAS.find(x=>x.id===i.pizzaId);return(p?p.name:'?');}).join(', ');
    return `<div class="ticker__chip" onclick="document.getElementById('g${g.id}')?.scrollIntoView({behavior:'smooth',block:'center'})">
      <div>
        <div class="ticker__num">G#${g.num}</div>
        <div class="ticker__name">${items}</div>
      </div>
      <div class="ticker__time" style="color:${col}">${fmt(g.remaining)}</div>
    </div>`;
  }).join('');
}

        <div class="tog${S.soundEnabled?' on':''}"
          onclick="S.soundEnabled=!S.soundEnabled;this.classList.toggle('on');saveS()"></div>
      </div>
      <div class="sp-row"><label>Vibración</label>
        <div class="tog${S.vibration?' on':''}"
          onclick="S.vibration=!S.vibration;this.classList.toggle('on');saveS()"></div>
      </div>
    </div>
    <div class="pg">
      <div class="pg__label">Notificaciones</div>
      <div class="sp-row">
        <label>Estado: <span style="color:${notifColor}">${notifText}</span></label>
        <button onclick="requestNotifPerm()"
          style="background:var(--g);color:var(--cr);border-radius:7px;padding:6px 12px;
                 font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
                 font-family:var(--ff);font-weight:900;cursor:pointer;border:none">Activar</button>
      </div>
    </div>
    <div class="pg">
      <div class="pg__label">Colores (%)</div>
      <div class="sp-row"><label>Amarillo por debajo de</label>
        <input class="sp-inp" type="number" value="${S.warnPct}" min="5" max="80"
          onchange="S.warnPct=+this.value;saveS()">%
      </div>
      <div class="sp-row"><label>Rojo por debajo de</label>
        <input class="sp-inp" type="number" value="${S.urgentPct}" min="3" max="50"
          onchange="S.urgentPct=+this.value;saveS()">%
      </div>
      <div class="sp-row"><label>Confirmar al borrar</label>
        <div class="tog${S.confirmDelete?' on':''}"
          onclick="S.confirmDelete=!S.confirmDelete;this.classList.toggle('on');saveS()"></div>
      </div>
    </div>
    <div class="pg">
      <div class="pg__label">Compatibilidad</div>
      <div style="font-size:.65rem;color:var(--cr4);line-height:2.2;font-weight:500">
        ${iosNote}${androidNote}${pwaNote}
        <div>Voz: ${voiceNote}</div>
        <div>Service Worker: ${swNote}</div>
      </div>
    </div>
  `;
}


function renderHp() {
  const b=document.getElementById('hp-body');
  if(!history.length){b.innerHTML='<div class="hp-empty">Sin historial todavía</div>';return;}
  b.innerHTML=history.map(h=>{
    const t=new Date(h.finishedAt),ts=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
    const dt=t.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
    const items=h.items.map(i=>{const p=PIZZAS.find(x=>x.id===i.pizzaId);return i.qty+'× '+(p?p.name:i.pizzaId)+' ('+(i.type==='slice'?'slice':'entera')+')'}).join(', ');
    return`<div class="hp-item"><div class="hp-time">Grupo #${h.num} — ${dt} ${ts}</div><div class="hp-items">${items}</div><div class="hp-dur">Duración: ${fmt(h.duration)}</div></div>`;
  }).join('');
}

function toggleFs() {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}
document.addEventListener('fullscreenchange',()=>document.getElementById('fs-btn').classList.toggle('on',!!document.fullscreenElement));

function toast(msg) {
  const t=document.createElement('div');t.className='toast';t.textContent=msg;t.setAttribute('role','status');
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.style.opacity='0',2400);setTimeout(()=>t.remove(),2700);
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='n'||e.key==='N') openModal();
  if(e.key==='f'||e.key==='F') toggleFs();
  if(e.key==='h'||e.key==='H') togglePanel('hp');
  if(e.key==='Escape'){closeModal();if(panels.sp)togglePanel('sp');if(panels.hp)togglePanel('hp');}
});

function fmt(s) { return Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0'); }

/* ── INIT ─────────────────────────────────────────────────────────── */
async function initApp() {
  groups = loadGroups();
  history = loadHistory();
  gCnt = parseInt(localStorage.getItem('ct_n') || '0');

  // CRITICAL: on every load, recalculate from real timestamps
  // This handles the case where the app was killed while timers were running
  const now = Date.now();
  let hadDone = false;
  groups.forEach(g => {
    if (g.status === 'running' && g.endTime) {
      g.remaining = Math.max(0, Math.ceil((g.endTime - now) / 1000));
      if (g.remaining === 0) { g.status = 'done'; hadDone = true; }
    }
  });
  if (hadDone) saveGroups();

  render(); renderHp(); updClk(); setInterval(updClk, 1000); ensureTick();

  // Start alarm if any group finished (including while app was closed)
  if (groups.some(g => g.status === 'done')) {
    alarmSoundActive = false; // force fresh start
    // Delay so audio context unlocks on first user gesture
    setTimeout(() => startAlarm(), 400);
  }
  if(!navigator.onLine) document.getElementById('offline-bar').classList.add('on');

  // SW
  await registerSW();

  // Notification banner
  if('Notification' in window && Notification.permission==='default') {
    setTimeout(()=>document.getElementById('perm-banner').classList.add('on'),2000);
  }

  // Install banner (Android only, not yet installed)
  if(isAndroid && !isPWA && deferredPrompt) {
    setTimeout(()=>document.getElementById('install-banner').classList.add('on'),5000);
  }

  // Periodic Background Sync registration
  if(swReg && 'periodicSync' in swReg) {
    try { await swReg.periodicSync.register('check-timers',{minInterval:60000}); } catch(e) {}
  }
}

// Unlock audio on first interaction (required by browsers)
['click','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{try{ac().resume()}catch(e){}},{once:true}));

// Handle #nuevo shortcut from manifest
if(location.hash==='#nuevo') openModal();

// Boot install screen
buildInstallSteps();
// If already PWA or told to skip, go straight to app
if(isPWA) skipInstall();
</script>
